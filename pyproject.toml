[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerguard"
version = "1.0.0"
description = "Sistem financiar multi-valutar demonstrativ cu detectie de frauda"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
core = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
ui = [
    "nicegui>=2.20,<4",
]
test = [
    "pytest>=8.0",
    "robotframework>=7.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]
ai = [
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["nicegui.*", "anthropic.*", "robot.*"]
ignore_missing_imports = true
